[package]
name = "usbc"
version = "0.1.0"
edition = "2021"
description = "USB Type-C cable quality warning tool"

[dependencies]
clap = { version = "4", features = ["derive"] }
udev = "0.9"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
libc = "0.2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"], optional = true }

[build-dependencies]
# Compiles resources/ into the binary; see build.rs. Needs glib-compile-resources.
glib-build-tools = { version = "0.22", optional = true }

[features]
# Desktop GUI (`usbc gui`). Needs GTK 4 and libadwaita development files.
gui = ["dep:gtk", "dep:adw", "dep:glib-build-tools"]

[dev-dependencies]
tempfile = "3"
